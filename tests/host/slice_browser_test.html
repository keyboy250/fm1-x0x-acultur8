<!doctype html><meta charset="utf-8"><title>Isolated browser slice CC acceptance</title><pre id="result">Running actual HOST WASM / production service / genuine disposable IndexedDB…</pre>
<script type="module">

 await import('../../web/emu/worklet.js');const p=new Processor(),wasm=await(await fetch('../../build/emu/x0x.wasm')).arrayBuffer();

 ok((await fire(5)).startsWith('applied'),'CC play');ok(render().some(x=>x>.09),'actual production mixed PCM');
 ok((await fire(6)).startsWith('applied')&&!p.ex.web_marked_playing(),'CC slice stop');

 ok((await fire(9)).startsWith('applied')&&service.imported.name.includes('synthetic'),'CC demo');
 ok((await fire(11)).startsWith('applied')&&service.imported.name==='synthetic.wav','CC real IndexedDB reopen');

 await router.disconnect();ok(!router.active,'explicit route disconnect');
 window.sliceAcceptance={pass:true,checks,physicalMidi:false,realAudioContext:false,genuineIndexedDB:true};line.textContent='PASS\n'+checks.join('\n')+'\nNo physical MIDI/AudioContext/deployment acceptance.';
}catch(e){window.sliceAcceptance={pass:false,error:e.stack,checks};line.textContent='FAIL\n'+e.stack+'\n'+checks.join('\n');}
finally{db?.close();indexedDB.deleteDatabase(dbName);}
